# Nginx Cache Configuration for Aiman Royale
# Add this to your nginx server block or upload to staging server

# Cache Static Assets
location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot|otf)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Cache CSS and JavaScript
location ~* \.(css|js)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Cache Media Files
location ~* \.(ogg|mp4|webm)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Cache JSON (API responses) - 1 hour
location ~* \.json$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

# No Cache for HTML
location ~* \.(html|htm)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# Disable ETag for better cache performance
etag off;
