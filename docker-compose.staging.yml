name: aiman-royale-staging

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiman-staging-app

    entrypoint: ["sh", "-c"]
    command: >
      "
      exec php-fpm
      "

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini

    networks:
      - aiman-staging-network

    depends_on:
      redis:
        condition: service_healthy

    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-aiman_royale_staging}
      DB_USERNAME: ${DB_USERNAME:-aiman_staging_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}


  nginx:
    image: nginx:alpine
    container_name: aiman-staging-nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8083:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/${NGINX_CONFIG_FILE}.conf:/etc/nginx/conf.d/default.conf

    networks:
      - aiman-staging-network

    depends_on:
      - app


  redis:
    image: redis:alpine
    container_name: aiman-staging-redis
    restart: unless-stopped

    volumes:
      - aiman_staging_redis_data:/data

    networks:
      - aiman-staging-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  node:
    image: node:22-alpine
    container_name: aiman-staging-node
    restart: "no"

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html
      - aiman_staging_node_modules:/var/www/html/node_modules

    networks:
      - aiman-staging-network

    command: >
      sh -c "
      npm ci &&
      npm run build &&
      chown -R 1001:1001 /var/www/html/public/build &&
      rm -f /var/www/html/public/hot
      "

    depends_on:
      - app


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: aiman-staging-elasticsearch
    restart: unless-stopped

    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"

    ulimits:
      memlock:
        soft: -1
        hard: -1

      nofile:
        soft: 65536
        hard: 65536

    volumes:
      - aiman_staging_elasticsearch_data:/var/lib/elasticsearch/data

    networks:
      - aiman-staging-network


  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    container_name: aiman-staging-kibana
    restart: unless-stopped

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    networks:
      - aiman-staging-network

    depends_on:
      - elasticsearch


networks:

  aiman-staging-network:
    driver: bridge


volumes:

  aiman_staging_redis_data:
    driver: local

  aiman_staging_elasticsearch_data:
    driver: local

  aiman_staging_node_modules:
    driver: local
